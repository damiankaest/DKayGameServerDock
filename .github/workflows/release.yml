name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Build self-contained setup package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DKayGameServerDock-win-x64
          path: |
            artifacts/DKayGameServerDock-win-x64.zip
            artifacts/DKayGameServerDock-win-x64.zip.sha256
          if-no-files-found: error
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/DKayGameServerDock-win-x64.zip `
            artifacts/DKayGameServerDock-win-x64.zip.sha256 `
            --verify-tag `
            --generate-notes `
            --title "DKay Game Server Dock ${{ github.ref_name }}"
