name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DKayGameServerDock.slnx
      - run: dotnet build DKayGameServerDock.slnx --configuration Release --no-restore
      - run: dotnet test DKayGameServerDock.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell setup scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts, . -Filter '*.ps1' -File | Sort-Object FullName -Unique | ForEach-Object {
            $file = $_
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in $errors) {
              Write-Error "$($file.FullName): $($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) { throw 'One or more PowerShell scripts contain syntax errors.' }
