<div class="app-shell" [class.menu-open]="menuOpen()">
  <aside class="sidebar">
    <a class="brand" routerLink="/" (click)="menuOpen.set(false)">
      <span class="brand-mark">D</span>
      <span><strong>DKay</strong><small>Game Server Dock</small></span>
    </a>

    <nav class="nav-list">
      <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active" (click)="menuOpen.set(false)"><span>⌂</span>Dashboard</a>
      <a routerLink="/servers" routerLinkActive="active" (click)="menuOpen.set(false)"><span>▤</span>Servers</a>
      <a routerLink="/library" routerLinkActive="active" (click)="menuOpen.set(false)"><span>◇</span>Game Library</a>
      <a routerLink="/activity" routerLinkActive="active" (click)="menuOpen.set(false)"><span>↗</span>Activity</a>
      <a routerLink="/backups" routerLinkActive="active" (click)="menuOpen.set(false)"><span>◫</span>Backups</a>
      <div class="nav-separator"></div>
      <a routerLink="/host" routerLinkActive="active" (click)="menuOpen.set(false)"><span>▰</span>Host</a>
      <a routerLink="/settings" routerLinkActive="active" (click)="menuOpen.set(false)"><span>⚙</span>Settings</a>
    </nav>

    <div class="sidebar-footer">
      <div class="host-online"><i></i><span>Dock online<small>Local network</small></span></div>
      <button class="ghost-button" type="button" (click)="logout()">Sign out</button>
    </div>
  </aside>

  @if (menuOpen()) {
    <button class="menu-backdrop" type="button" aria-label="Close navigation" (click)="menuOpen.set(false)"></button>
  }

  <main class="main-area">
    <header class="mobile-header">
      <button class="icon-button" type="button" aria-label="Open navigation" (click)="menuOpen.set(true)">☰</button>
      <span>DKay Game Server Dock</span>
      <i class="online-dot"></i>
    </header>
    <router-outlet />
  </main>
</div>
